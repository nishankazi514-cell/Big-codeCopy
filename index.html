<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Code Copier V3</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080a0f;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.header{
  background:#11151e;
  border-bottom:1px solid #292f3c;
  padding:18px 14px;
  text-align:center;
}

.header h1{
  font-size:23px;
}

.header p{
  color:#8b94a7;
  font-size:12px;
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 8px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.copy{
  background:#1677ff;
}

.part{
  background:#008f66;
}

.download{
  background:#7b42d6;
}

.clear{
  background:#d9363e;
}

.editor{
  border:1px solid #292f3c;
  border-radius:13px;
  overflow:hidden;
  background:#0d1016;
}

.editor-head{
  height:43px;
  background:#171b24;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  border-bottom:1px solid #292f3c;
}

.title{
  color:#aeb6c6;
  font-size:12px;
  font-weight:bold;
}

textarea{
  width:100%;
  height:65vh;
  min-height:430px;
  display:block;
  resize:vertical;
  border:0;
  outline:0;
  padding:16px;
  background:#0b0e14;
  color:#edf1f7;
  font-family:Consolas,Monaco,monospace;
  font-size:14px;
  line-height:1.6;
}

.info{
  display:flex;
  justify-content:space-between;
  padding:11px 2px;
  color:#8992a5;
  font-size:12px;
}

.status{
  text-align:center;
  min-height:21px;
  color:#4dde83;
  font-size:13px;
  font-weight:bold;
}

.partbox{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#11151e;
  border:1px solid #292f3c;
  border-radius:11px;
}

.partbox.show{
  display:block;
}

.partinfo{
  color:#aeb6c6;
  font-size:12px;
  margin-bottom:9px;
  text-align:center;
}

.partbuttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tip{
  text-align:center;
  color:#697285;
  font-size:11px;
  line-height:1.5;
  padding:13px 8px;
}

@media(min-width:700px){
  .toolbar{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>📋 Big Code Copier</h1>
  <p>Large Code • Fast Copy • Download</p>
</header>

<main class="container">

  <div class="toolbar">

    <button class="copy" onclick="copyAll()">
      📋 COPY ALL
    </button>

    <button class="part" onclick="prepareParts()">
      📦 COPY IN PARTS
    </button>

    <button class="download" onclick="downloadCode()">
      💾 DOWNLOAD
    </button>

    <button class="clear" onclick="clearCode()">
      🗑 CLEAR
    </button>

  </div>

  <div class="editor">

    <div class="editor-head">
      <div class="title">CODE EDITOR</div>
    </div>

    <textarea
      id="code"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      placeholder="Paste your large HTML, CSS, JavaScript, Python or any code here..."
      oninput="updateStats()"
    ></textarea>

  </div>

  <div class="info">
    <span>Lines: <b id="lines">0</b></span>
    <span>Characters: <b id="chars">0</b></span>
  </div>

  <div id="status" class="status"></div>

  <div id="partbox" class="partbox">

    <div id="partinfo" class="partinfo">
      Parts are ready
    </div>

    <div class="partbuttons">

      <button class="copy" onclick="copyCurrentPart()">
        📋 COPY PART
      </button>

      <button class="part" onclick="nextPart()">
        ➡️ NEXT PART
      </button>

    </div>

  </div>

  <div class="tip">
    Very large code can be copied in parts or downloaded as a TXT file.
  </div>

</main>

<script>

const editor =
  document.getElementById("code");

const lines =
  document.getElementById("lines");

const chars =
  document.getElementById("chars");

const statusBox =
  document.getElementById("status");

const partBox =
  document.getElementById("partbox");

const partInfo =
  document.getElementById("partinfo");


let parts = [];
let currentPart = 0;


/* -------------------------
   STATS
------------------------- */

function updateStats(){

  const text = editor.value;

  chars.textContent = text.length;

  if(text.length === 0){

    lines.textContent = 0;

  }else{

    lines.textContent =
      text.split(/\r\n|\r|\n/).length;

  }

}


/* -------------------------
   COPY ALL
------------------------- */

async function copyAll(){

  const text = editor.value;

  if(!text){

    showStatus("Nothing to copy");

    return;
  }

  try{

    await navigator.clipboard.writeText(text);

    showStatus("✓ ALL CODE COPIED");

  }catch(error){

    editor.focus();
    editor.select();

    try{

      document.execCommand("copy");

      showStatus("✓ ALL CODE COPIED");

    }catch(e){

      showStatus(
        "Copy failed — use COPY IN PARTS"
      );

    }

  }

}


/* -------------------------
   PREPARE PARTS
------------------------- */

function prepareParts(){

  const text = editor.value;

  if(!text){

    showStatus("Nothing to split");

    return;
  }

  /*
    Each part is 50000 characters.
    This helps when the browser clipboard
    cannot handle the complete code.
  */

  const size = 50000;

  parts = [];

  for(
    let i = 0;
    i < text.length;
    i += size
  ){

    parts.push(
      text.slice(i,i + size)
    );

  }

  currentPart = 0;

  partBox.classList.add("show");

  updatePartInfo();

  showStatus(
    "✓ Code divided into " +
    parts.length +
    " parts"
  );

}


/* -------------------------
   PART INFO
------------------------- */

function updatePartInfo(){

  if(!parts.length){

    partInfo.textContent =
      "No parts";

    return;
  }

  partInfo.textContent =
    "Part " +
    (currentPart + 1) +
    " of " +
    parts.length +
    " • " +
    parts[currentPart].length +
    " characters";

}


/* -------------------------
   COPY CURRENT PART
------------------------- */

async function copyCurrentPart(){

  if(!parts.length){

    prepareParts();

    return;
  }

  const text =
    parts[currentPart];

  try{

    await navigator.clipboard.writeText(text);

    showStatus(
      "✓ PART " +
      (currentPart + 1) +
      " COPIED"
    );

  }catch(error){

    const temp =
      document.createElement("textarea");

    temp.value = text;

    document.body.appendChild(temp);

    temp.select();

    try{

      document.execCommand("copy");

      showStatus(
        "✓ PART " +
        (currentPart + 1) +
        " COPIED"
      );

    }catch(e){

      showStatus(
        "Copy failed"
      );

    }

    temp.remove();

  }

}


/* -------------------------
   NEXT PART
------------------------- */

function nextPart(){

  if(!parts.length){

    prepareParts();

    return;
  }

  if(currentPart >= parts.length - 1){

    showStatus(
      "✓ This is the last part"
    );

    return;
  }

  currentPart++;

  updatePartInfo();

  showStatus(
    "Ready: Part " +
    (currentPart + 1)
  );

}


/* -------------------------
   DOWNLOAD
------------------------- */

function downloadCode(){

  const text = editor.value;

  if(!text){

    showStatus("Nothing to download");

    return;
  }

  const blob =
    new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "large-code.txt";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showStatus(
    "✓ CODE DOWNLOADED"
  );

}


/* -------------------------
   CLEAR
------------------------- */

function clearCode(){

  editor.value = "";

  parts = [];

  currentPart = 0;

  partBox.classList.remove("show");

  updateStats();

  showStatus(
    "✓ CODE CLEARED"
  );

}


/* -------------------------
   STATUS
------------------------- */

function showStatus(message){

  statusBox.textContent =
    message;

  clearTimeout(
    window.statusTimer
  );

  window.statusTimer =
    setTimeout(function(){

      statusBox.textContent = "";

    },2500);

}


updateStats();

</script>

</body>
</html>
